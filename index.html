<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iOS 面试复习</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="top-bar">
      <div>
        <p class="eyebrow">iOS Interview Coach</p>
        <h1>iOS 面试复习</h1>
      </div>
      <label class="filter">
        <span>分类</span>
        <select id="categoryFilter" aria-label="按分类筛选题目">
          <option value="all">全部</option>
        </select>
      </label>
    </header>

    <section class="workspace" aria-live="polite">
      <aside class="question-pane" aria-label="题目列表">
        <div class="pane-head">
          <h2>题目</h2>
          <span id="questionCount">0</span>
        </div>
        <div id="questionList" class="question-list"></div>
      </aside>

      <article class="detail-pane" aria-label="题目详情">
        <div class="detail-head">
          <div>
            <div id="metaLine" class="meta-line"></div>
            <h2 id="questionTitle">请选择题目</h2>
          </div>
          <div class="status-actions">
            <button id="favoriteButton" type="button" class="icon-button" aria-pressed="false" title="收藏">☆</button>
            <button id="masteredButton" type="button" class="icon-button" aria-pressed="false" title="已掌握">✓</button>
          </div>
        </div>

        <div class="answer-actions">
          <button id="toggleAnswerButton" type="button">显示答案</button>
          <button id="speakButton" type="button">朗读答案</button>
        </div>

        <section id="answerBox" class="answer-box is-hidden">
          <h3>答案</h3>
          <p id="answerText"></p>
        </section>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
